name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/superpowers/**'
      - 'README.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: construction du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # Recette partagée avec le job `docs` de ci.yml (build de vérification,
      # non déployé) — voir scripts/build-docs.sh pour le détail et le pourquoi
      # de chaque étape.
      - name: build
        run: scripts/build-docs.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: déploiement Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
