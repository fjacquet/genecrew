[project]
name = "genecrew"
version = "0.1.0"
description = "GeneCrew - équipe d'agents IA pour la généalogie (Gramps Web)"
authors = [{ name = "Frederic Jacquet" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai[tools]>=1.15.2",
    "crewai-custom-tools",
    "python-dotenv>=1.0.0",
    "litellm>=1.93.0",
]

[project.scripts]
genecrew = "genecrew.main:main"
run_crew = "genecrew.main:run"
train = "genecrew.main:train"
replay = "genecrew.main:replay"
test = "genecrew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Le code CrewAI reste sous genecrew/src/genecrew/ (layout crewai) ; le pyproject
# est à la racine, donc on indique explicitement où trouver le paquet.
[tool.hatch.build.targets.wheel]
packages = ["genecrew/src/genecrew"]

[tool.crewai]
type = "crew"

[tool.uv]
# Planchers de sécurité sur des dépendances TRANSITIVES (tirées par crewai, qui
# les déclare sans contrainte de version). `constraint-dependencies` relève le
# plancher sans en faire des dépendances directes : on ne les importe pas, on
# refuse seulement d'en installer une version vulnérable.
#
#   mcp         >= 1.28.1  GHSA-hvrp-rf83-w775, GHSA-jpw9-pfvf-9f58,
#                          GHSA-vj7q-gjh5-988w  (3 HAUTES)
#   json-repair >= 0.60.1  GHSA-xf7x-x43h-rpqh  (HAUTE, déni de service par
#                          `$ref` circulaire dans un schéma JSON)
#
# À retirer le jour où crewai relève lui-même ses planchers : une contrainte qui
# a cessé d'être nécessaire finit par bloquer une résolution légitime.
constraint-dependencies = [
    "mcp>=1.28.1",
    "json-repair>=0.60.1",
]

[tool.uv.sources]
crewai-custom-tools = { path = "../crewai_custom_tools", editable = true }


[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.ruff]
# Aligné sur la bibliothèque voisine. Mesuré : p99 = 93 caractères, zéro ligne au-dessus
# de 120 — le défaut de ruff (88) en signalerait 193 sans rien apprendre.
line-length = 120

[tool.ruff.lint]
# Le jeu par défaut (E4, E7, E9, F) ne voit ni les imports désordonnés, ni les fermetures
# sur variable de boucle, ni un `zip` qui tronque en silence. Les deux derniers sont des
# risques de perte de données : un `zip` désynchronisé dans une fusion IRRÉVERSIBLE ferait
# sauter une personne sans un mot.
select = ["E", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Projet francophone : l'apostrophe typographique (’) et l'espace insécable sont
    # voulues dans les libellés, les docstrings et les commentaires.
    "RUF001", "RUF002", "RUF003",
]
