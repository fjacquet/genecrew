interpreter_anomalies:
  description: >
    Voici les anomalies déterministes détectées sur un lot de personnes de l'arbre
    généalogique (date du run : {date}). Chaque bloc donne le gramps_id, le handle
    interne et le nom de la personne, puis la liste de ses anomalies (règle, gravité,
    message) :

    {anomalies_block}

    Pour CHAQUE personne, analyse ses anomalies. Recoupe si c'est utile via les outils
    de lecture Gramps (chronologie de la personne, objets liés) et Wikipédia (contexte
    historique d'une date, d'un lieu ou d'un événement). Puis produis un verdict :
      - gramps_id, handle et nom (recopie-les tels quels, sans les altérer) ;
      - verdict : "anomalie" (erreur ferme à corriger) ou "a_verifier" (doute à lever) ;
      - priorité : haute | moyenne | basse ;
      - note : un paragraphe en français qui explique le problème et la piste à suivre.
    N'invente aucun fait. Tu n'as aucun outil d'écriture : tu ne fais que lire et juger.
  expected_output: >
    Une liste, une entrée par personne signalée, chacune indiquant explicitement :
    gramps_id, handle, nom, verdict (anomalie|a_verifier), priorité (haute|moyenne|basse)
    et le texte complet de la note.
  agent: detective

rechercher_preuves:
  description: >
    À partir des verdicts du Détective, cherche des PREUVES externes — uniquement pour
    les cas où une source accessible peut trancher : verdicts "anomalie" et personnes
    signalées sans source dont les faits sont postérieurs à 1970 ou publiquement notoires.
    Outils : insee_deces_search (décès français depuis 1970 — le réflexe pour confirmer
    un décès du XXe siècle), gallica_search (presse et fonds numérisés BnF), wikidata_sparql,
    Wikipédia, lecture Gramps pour recouper. Discipline stricte : au plus 4 requêtes par
    personne ; ne cherche PAS pour les personnes anciennes sans état civil numérisé — dis
    simplement "aucune source accessible".
    Pour chaque personne, rends : gramps_id, handle et nom recopiés tels quels, puis soit
    la ou les preuves trouvées (source, URL ou identifiant, ce qu'elle établit exactement,
    degré de correspondance fort/moyen/faible sur nom+dates+lieux), soit "aucune preuve".
    Une piste n'est jamais un fait : rapporte ce que dit la source, sans extrapoler.
  expected_output: >
    Une liste, une entrée par personne signalée : gramps_id, handle, nom, et les preuves
    trouvées (source, référence/URL, ce qu'elle établit, degré de correspondance) ou la
    mention explicite "aucune preuve" / "aucune source accessible".
  agent: historien

formuler_propositions:
  description: >
    À partir des verdicts du Détective et des preuves de l'Historien, formule les
    propositions de correction PRÉCISES — seulement quand une action concrète se justifie.
    Une proposition doit être applicable en une minute par un humain dans Gramps Web :
    objet visé (identifiant Gramps), action exacte, preuve à l'appui, priorité, confiance.
    Vérifie tes formulations si besoin avec genealogy_check_person (re-vérifier une
    personne), genealogy_resolve_place (normaliser un lieu cité) ou gramps_get_object
    (lire l'objet exact). Règles impératives :
      - gramps_id, handle et personne recopiés tels quels depuis les verdicts ;
      - type parmi : date, lieu, relation, nom, source, doublon, autre ;
      - confiance = 1 (plausible) ou 2 (preuve concordante) — JAMAIS plus : seul
        l'humain monte au-dessus ;
      - pas d'action évidente → pas de proposition (pas de remplissage) ;
      - priorite : haute | moyenne | basse.
  expected_output: >
    UNIQUEMENT un objet JSON valide, sans aucune prose autour et sans clôture markdown,
    de la forme exacte : {"propositions": [{"type": "...", "gramps_id": "...",
    "handle": "...", "personne": "...", "cible": "...", "action": "...",
    "preuve_url": "...", "preuve_detail": "...", "priorite": "...", "confiance": 1}]}.
    Si aucune action concrète ne se justifie : {"propositions": []}.
  agent: standardisateur

rediger_annotations:
  description: >
    À partir des verdicts du Détective, consigne chaque personne signalée dans Gramps,
    de façon strictement additive. Pour chaque personne, dans cet ordre :
      1. Assure-toi que le tag qualité existe avec gramps_ensure_tag : le nom du tag est
         "ia-anomalie" si le verdict est "anomalie", "ia-a-verifier" si le verdict est
         "a_verifier". Récupère le handle du tag renvoyé.
      2. Crée la note avec gramps_create_note : le texte DOIT commencer par le marqueur
         exact "[genecrew:audit:{date}:detective] " suivi du texte de la note rédigé par
         le Détective. Récupère le handle de la note renvoyé.
      3. Attache la note ET le tag à la personne avec gramps_attach, en passant le handle
         de la personne (celui fourni par le Détective), le handle de la note et le handle
         du tag.
    Ne touche à rien d'autre : ni nom, ni date, ni lien. Si le mode simulation est actif,
    les outils renvoient des handles factices et n'appliquent aucune écriture — reprends
    alors ces handles factices dans les étapes suivantes.
  expected_output: >
    Un récapitulatif, une entrée par personne : gramps_id, le tag posé (ia-anomalie ou
    ia-a-verifier), un extrait de la note créée, et si l'écriture a été réelle ou simulée.
  agent: chroniqueur
